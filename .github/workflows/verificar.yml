# Puertas de calidad de MorphiqPOS (F1.0-T09).
#
# Bloquean el merge. R19: "Lint y tipos en cero errores, desde el primer commit.
# Después nunca se recupera. El POS de restaurante llegó a 1,592 diagnósticos de
# tipos por no aplicar esto."
#
# ESTADO: corriendo en cada empujón desde el 18-09-2026, y verde. Decía «escrito
# y sin ejecutar, el repositorio todavía no tiene remoto»: eso dejó de ser verdad
# y un comentario de estado que miente es peor que ninguno.
#
# Cada paso invoca EXACTAMENTE el mismo script que `pnpm verify` en local. Lo que
# NO está aquí, y hay que saberlo: `verify:esquema`, `verify:rls` y
# `verify:acople` hablan con la base viva y con el despliegue, así que se corren
# desde la máquina de quien despliega. Todo lo demás —incluidos los nueve arneses
# de mutación, que entraron el 20-09-2026 en su propio trabajo— sí corre aquí.
#
# Por qué entraron: el tablero de la tiendita se empujó con un contrato ROTO
# —`ningun_comando_escribe_la_lista_a_mano`, porque declaraba `paquetes: ['tienda']`
# a mano— y el CI dio verde igual, porque ninguno de los arneses corría aquí. Una
# puerta que sólo existe en una laptop no es una puerta del proyecto.
#
# Las acciones de terceros van fijadas a SHA completo, no a etiqueta: una
# etiqueta se puede mover a otro commit y ejecutar código distinto sin que
# cambie una línea de este archivo (gate morphiq-prs §20).

name: Verificar

# POS Don Poncho (DP-2): sin `push` a `main`. Se trabaja directo en `main` durante el
# arranque y cada corrida completa cuesta minutos de Actions: corre en cada PR y a mano
# (`workflow_dispatch`), que es cuando alguien la va a leer.
on:
  pull_request:
  # Para correr el rastreo COMPLETO —el restaurante en los nueve estilos— sin empujar a
  # `main`: es el que cualquiera lanza antes de fusionar un cambio de diseño.
  workflow_dispatch:
    inputs:
      actualizar_galeria:
        description: 'Regenerar los retratos de la galería (declarar un cambio de diseño)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  calidad:
    name: Formato · lint · tipos · pruebas · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Postgres real para las pruebas de integración. 13-PRUEBAS §2:
      # "Prohibido mockear la base de datos en pruebas de integración. Un mock
      # no reproduce restricciones únicas, transacciones ni carreras — que es
      # exactamente lo que se está probando."
      #
      # La MISMA versión mayor que producción (Supabase corre 17.6): una base 16 dejaba pasar
      # en CI lo que la 17 trata distinto, y dejaba fuera lo que sólo existe en la 17.
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: morphiqpos
          POSTGRES_PASSWORD: morphiqpos_ci
          POSTGRES_DB: morphiqpos_pruebas
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U morphiqpos -d morphiqpos_pruebas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        # --frozen-lockfile: si alguien cambió package.json sin actualizar el
        # lockfile, aquí falla en vez de instalar versiones distintas a las que
        # se probaron en local (gate PRS §20, build reproducible).
        run: pnpm install --frozen-lockfile

      # --- Puertas que no necesitan compilar nada -------------------------
      - name: Estructura del monorepo
        run: pnpm verify:estructura

      - name: Contrato de historico/
        run: pnpm verify:historico

      - name: TypeScript estricto
        run: pnpm verify:tsconfig

      - name: Entorno local reproducible
        run: pnpm verify:entorno

      - name: Residuos de la plataforma erradicada
        run: pnpm verify:residuos

      - name: Tokens del sistema de diseño
        run: pnpm verify:primitivas

      # Cada uno de los nueve estilos declara TODOS los tokens del contrato, y ningún
      # par de color baja de AA. Se calcula, no se mira: un estilo que no pasa no se
      # publica, por bonito que sea.
      - name: Contraste de los nueve estilos
        run: pnpm verify:estilos

      # Todo comando que declara escribir deja rastro. `definirComando` ya lo exige en
      # ejecución, y las 248 pruebas de comandos llaman a `.ejecutar()` directamente,
      # así que esa exigencia no la comprueba nadie: un comando puede estar roto de
      # esta forma exacta con sus pruebas en verde. `configuracion.fijar_apariencia`
      # lo estuvo, y nunca pudo guardar nada.
      - name: Todo comando que escribe deja rastro
        run: pnpm verify:rastro

      # El dinero del puente llega en la unidad que declara su `conversion`, no en la que
      # dice su nombre: 22 campos se llaman `_centavos` y llegan en pesos, y una cita de
      # $350.00 se pintó $3.50. Toda lectura de dinero de una fila del puente pasa por
      # `centavosDe` (etapa 2.4, C.2).
      - name: Unidades del dinero del puente
        run: pnpm verify:unidades

      # Lo que se dejó a medias, contado: «Alcance recortado», consultas sustituidas por una
      # lista vacía, importes provisionales en cero y excepciones sin motivo (2.4, C.10).
      - name: Nada a medias
        run: pnpm verify:pendientes

      # La matriz de permisos y las rutas del aislamiento SALEN del registro de comandos.
      # Si alguien cambia los roles de un comando y no las regenera, las dos pruebas
      # seguirían verdes comprobando permisos que ya no son los del código (2.4, D.3 y D.4).
      - name: La matriz de permisos y el aislamiento, al día con los comandos
        run: pnpm verify:matriz

      # El reseteo de una demo borra TODA tabla salvo las que conserva con su razón, en
      # el orden de las llaves foráneas: una tabla nueva no se puede quedar fuera (2.4, B.2).
      - name: El reseteo del restaurante de prueba cubre el esquema
        run: pnpm verify:limpieza

      # --- Formato, lint y tipos -------------------------------------------
      - name: Formato
        run: pnpm format:check

      - name: Lint y regla de dependencia entre capas
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      # --- Pruebas ----------------------------------------------------------
      - name: Pruebas unitarias
        run: pnpm test:unit

      # `morphiqpos_app` es el rol con el que la aplicación habla con la base: sólo
      # DML, sin DDL, y es a quien las migraciones dan permisos desde la 049. En
      # una base recién creada no existe, y la migración se detuvo ahí con
      # «role "morphiqpos_app" does not exist» — correctamente, sin dejar la base
      # a medias. Aquí se crea con la misma forma que en producción
      # (`scripts/credencial-db.mjs`), sin contraseña: nadie entra con él, sólo
      # recibe los `grant`.
      - name: El rol de la aplicación en la base de pruebas
        env:
          PGPASSWORD: morphiqpos_ci
        run: |
          CONEXION="-h localhost -p 5433 -U morphiqpos -d morphiqpos_pruebas"
          if [ -z "$(psql $CONEXION -tAc "select 1 from pg_roles where rolname = 'morphiqpos_app'")" ]; then
            psql $CONEXION -v ON_ERROR_STOP=1 -c "create role morphiqpos_app with login bypassrls"
          fi

      # El esquema tiene que existir ANTES de las pruebas de integración: dos de
      # los cinco archivos escriben en `organizaciones`, `categorias`, `ventas` y
      # `auditoria`, y una base recién creada no tiene ninguna. Aquí se aplican
      # las migraciones de verdad, con su ledger, sobre el servicio de este job.
      - name: Migraciones sobre la base de pruebas
        env:
          DATABASE_URL: postgres://morphiqpos:morphiqpos_ci@localhost:5433/morphiqpos_pruebas
        run: pnpm --filter @morphiqpos/data migrate

      # `DATABASE_URL_PRUEBAS` es lo que lee `prepararPostgres()` para NO
      # levantar su propio contenedor. Antes sólo se definía `DATABASE_URL`, así
      # que en CI el arnés ignoraba el servicio —que sí tiene comprobación de
      # salud— y arrancaba un Postgres propio en el 5434 cuya inicialización
      # todavía no había acabado cuando las dos primeras pruebas consultaron.
      - name: Pruebas de integración contra Postgres real
        env:
          DATABASE_URL: postgres://morphiqpos:morphiqpos_ci@localhost:5433/morphiqpos_pruebas
          DATABASE_URL_PRUEBAS: postgres://morphiqpos:morphiqpos_ci@localhost:5433/morphiqpos_pruebas
        run: pnpm test:integracion

      # --- Build y humo -----------------------------------------------------
      - name: Build de producción
        run: pnpm build

      - name: Cabeceras de seguridad en vivo
        run: pnpm verify:cabeceras

  adopcion:
    name: Adopción del sistema de diseño
    runs-on: ubuntu-latest
    # Trabajo PROPIO y no un paso de otro: mientras las pantallas se recomponían esta
    # puerta estuvo en rojo a propósito —era el marcador de la etapa—, y como paso de
    # «Formato · lint · tipos» habría cortado los tipos, las pruebas y el build de cada
    # empujón. Desde el cierre de la 2.4 está en VERDE (las piezas que pinta una pantalla
    # se distinguen de las pantallas, con su razón), y sigue aparte por lo mismo: si se
    # pone roja, que se vea sola y todo lo demás siga a la vista.
    timeout-minutes: 10

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Una pantalla está adoptada si cumple las CUATRO: cero superficies, tablas y
      # dinero a mano, y sus tres estados del sistema. Importar `Vacio` no cuenta.
      - name: Las pantallas usan el sistema, no lo importan
        run: pnpm verify:adopcion --detalle

  contratos:
    name: Contratos y mutaciones
    runs-on: ubuntu-latest
    # Los nueve arneses mutan el árbol y vuelven a correr una parte de la suite
    # por cada mutación. MEDIDO en este runner: 2 min 24 s el trabajo entero, de
    # los que 63 s son `verify:mutaciones-backend`. En una laptop de Windows son
    # más de diez, porque ahí lo caro es arrancar procesos, no mutar.
    timeout-minutes: 45

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CON HISTORIA. `verify:aspecto` compara `apps/web/heredado/` contra el
          # commit en que Miguel lo entregó, y con el clon superficial que hace
          # `checkout` por omisión ese objeto no existe: la primera corrida de
          # este trabajo murió con `fatal: bad object 89830e5`. Es la única puerta
          # de aquí que necesita mirar hacia atrás.
          fetch-depth: 0

      - name: Preparar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # --- Puertas estáticas, que no mutan nada ----------------------------
      - name: Las pruebas en su puerta, y ningún script que esquive la raíz
        run: pnpm verify:pruebas

      - name: Escrituras y lecturas del puente
        run: |
          pnpm verify:escrituras
          pnpm verify:lecturas

      # El tipo que la pantalla DECLARA contra el que el puente ENTREGA. Cazó
      # ocho: `MapaDeMesas` llamaba `.localeCompare` sobre un número y moría en
      # cuanto llegaban las mesas, y `cafeteria/Recetas` hacía `.replace` sobre
      # otro. Ninguna otra puerta lo ve: TypeScript cree la declaración.
      - name: Tipos de pantalla contra el puente
        run: pnpm verify:tipos-de-pantalla

      # Cada `href` interno contra las pantallas que `app/` sirve de verdad. Cazó
      # seis 404 en la cara del usuario, uno de ellos a una pantalla que no existe
      # en ninguna parte del sistema. La puerta de «rutas llamadas» no los ve:
      # aquélla comprueba las de `/api/`.
      - name: Enlaces internos
        run: pnpm verify:enlaces

      # Lo que una pantalla PUBLICA contra lo que el comando ACEPTA. Cazó
      # veintiuna: cambiar un precio, identificar a una clienta, contar la leche,
      # capturar una receta, abrir un rollo y cortarlo NO funcionaban en ninguno de
      # sus modelos, y un pago de crédito se aplicaba a la factura equivocada sin
      # error en ninguna parte.
      - name: Entradas de comando
        run: pnpm verify:entradas

      - name: El heredado sin tocar
        run: pnpm verify:aspecto

      - name: Cobertura de la Fase 2 · funciones, rutas, pantallas
        run: pnpm verify:cobertura

      # --- Los arneses de mutación -----------------------------------------
      # Cada uno rompe una invariante a propósito y exige que la suite lo cace.
      # Un contrato que nadie ha visto fallar no se sabe si funciona.
      - name: Contratos del catálogo y del inventario
        run: |
          pnpm verify:catalogo
          pnpm verify:inventario
          pnpm verify:comandos-catalogo
          pnpm verify:comandos-inventario

      - name: Contratos de la venta y de la identidad
        run: |
          pnpm verify:venta
          pnpm verify:identidad

      - name: Contratos del selector de paquete
        run: pnpm verify:paquetes

      - name: Contratos del backend, mutados
        run: pnpm verify:mutaciones-backend

  # ─────────────────────────────────────────────────────────────────────────
  # EL RASTREADOR · toca cada botón de cada pantalla del restaurante.
  #
  # Por qué está aquí, y por qué no estaba: la vuelta 2.3 lo construyó, corrió
  # contra producción y destapó 58 defectos —siete de ellos botones que no hacían
  # NADA al tocarlos—. Y después se quedó fuera de CI, así que una regresión de
  # botón muerto volvía sin que nada la detectara. Una puerta que sólo existe en
  # una laptop no es una puerta del proyecto; eso ya está escrito arriba, para los
  # arneses de mutación, y vale igual para esto.
  #
  # POS Don Poncho (DP-2): un solo modelo, el restaurante, sobre su restaurante de prueba.
  # Los nueve estilos completos corren a mano (`workflow_dispatch`); en cada PR, el reducido:
  # el de la casa, `don-poncho`.
  #
  # CADA TRABAJO SE PROVISIONA SOLO: su Postgres, sus migraciones, su restaurante de
  # prueba con su equipo y su catálogo. No habla con producción ni con el
  # preview: sin secretos, y por eso puede correr en un pull request de cualquiera.
  rastreo:
    name: Rastreo · ${{ matrix.modelo }} · ${{ matrix.estilo }}
    runs-on: ubuntu-latest
    # El techo del modelo más lento (13.8 min de rastreo) más el arranque:
    # instalar, migrar, sembrar, construir y levantar el servidor.
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        modelo: [restaurante]
        # LOS NUEVE ESTILOS. Un estilo que esconde un botón detrás de otro, o que deja
        # ilegible una tabla densa, es un botón muerto en una pantalla de verdad. Completo
        # (9 trabajos) a mano (`workflow_dispatch`); en cada pull request, REDUCIDO: el
        # estilo propio del restaurante.
        estilo: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["don-poncho","morphiq","cristal","relieve","taller","bloque","terminal","papel","noche"]' || '["reducido"]') }}
        include:
          - modelo: restaurante
            suite: restaurante
            propio: don-poncho

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: morphiqpos
          POSTGRES_PASSWORD: morphiqpos_ci
          POSTGRES_DB: morphiqpos_rastreo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U morphiqpos -d morphiqpos_rastreo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://morphiqpos:morphiqpos_ci@localhost:5433/morphiqpos_rastreo
      # El servidor de Playwright hereda este entorno, así que estas cuatro son
      # las del SERVIDOR y las tres de abajo las de la PRUEBA.
      APP_URL: http://localhost:3200
      ORGANIZACION: prueba-restaurante
      # Un despliegue de CI no tiene almacén de archivos, y eso está traducido a
      # un 503 legible con el endpoint escrito (`ErrorDeAlmacen`). Las cuatro
      # variables existen porque el contrato del entorno las exige para arrancar.
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: pos-don-poncho
      STORAGE_ACCESS_KEY: rastreo-sin-almacen
      STORAGE_SECRET_KEY: rastreo-sin-almacen
      # Secretos de USAR Y TIRAR, de este trabajo y de nadie más: la base se crea
      # y se destruye con él. Tienen que pasar el contrato del entorno —32
      # caracteres y sin los marcadores de `.env.example`— y por eso no dicen
      # «cambiame».
      SESSION_SECRET: rastreo_de_ci_firma_de_sesion_efimera_2026
      PIN_PEPPER: rastreo_de_ci_pimienta_de_pin_efimera_2026
      NODE_ENV: production
      TZ: America/Mexico_City

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: El navegador de Playwright
        # Sólo Chromium: el proyecto `escritorio` es Desktop Chrome y el rastreo
        # corre ahí. Firefox y WebKit son 300 MB por cabeza que nadie usa aquí.
        run: pnpm exec playwright install --with-deps chromium

      - name: El rol de la aplicación en la base
        env:
          PGPASSWORD: morphiqpos_ci
        run: |
          CONEXION="-h localhost -p 5433 -U morphiqpos -d morphiqpos_rastreo"
          if [ -z "$(psql $CONEXION -tAc "select 1 from pg_roles where rolname = 'morphiqpos_app'")" ]; then
            psql $CONEXION -v ON_ERROR_STOP=1 -c "create role morphiqpos_app with login bypassrls"
          fi

      - name: Migraciones
        run: pnpm --filter @morphiqpos/data migrate

      # El negocio, su sucursal y su dueño, por las MISMAS dos órdenes con que se
      # da de alta un negocio de verdad. Nada de SQL a mano: un alta que no pasa
      # por el alta no prueba que el alta funcione.
      - name: El restaurante de prueba y su dueño
        run: |
          pnpm db:alta-negocio \
            --slug "prueba-restaurante" \
            --nombre "Restaurante de prueba" \
            --giro restaurante \
            --paquete restaurante
          pnpm db:bootstrap --org "prueba-restaurante" --persona "Dueña de prueba" --pin 1234

      # El catálogo, el equipo con sus roles, el inventario y la sala. Es el MISMO
      # comando `configuracion.resetear_negocio_de_prueba`, con su transacción y su auditoría.
      - name: Sembrar el restaurante de prueba
        run: node --conditions=react-server scripts/sembrar-pruebas.mjs --solo prueba-restaurante

      # LOS OCHO ESTILOS, EN UN NAVEGADOR, y antes del rastreo a propósito.
      #
      # Dura diez segundos y el rastreo catorce minutos: si un estilo esconde un
      # botón, se sabe ya en vez de al final.
      #
      # `test:e2e` construye y levanta el servidor él mismo; el build lo comparte con
      # el paso siguiente por la caché de turbo, así que no se paga dos veces.
      - name: Los nueve estilos, en el navegador
        if: matrix.estilo == 'reducido' || matrix.estilo == 'don-poncho'
        run: pnpm test:e2e pruebas/e2e/estilos.spec.ts pruebas/e2e/contraste.spec.ts --project=escritorio

      # Playwright construye y levanta el servidor él mismo (`webServer` de
      # `playwright.config.ts`), heredando el entorno de este trabajo.
      - name: Tocar cada botón de cada pantalla
        env:
          MORPHIQPOS_ORG_DEMO: prueba-restaurante
          MORPHIQPOS_DEMO_PERSONA: Dueña de prueba
          MORPHIQPOS_DEMO_PIN: '1234'
          MORPHIQPOS_ESTILOS: ${{ matrix.estilo == 'reducido' && matrix.propio || matrix.estilo }}
        run: pnpm test:e2e pruebas/e2e/rastreo.spec.ts --project=escritorio

      # LA SUITE DE SU MODELO, que hasta hoy no corría en ninguna parte.
      #
      # ── Lo que costó no correrlas ─────────────────────────────────────────
      # Este flujo lanzaba DOS de los ocho especs que existen —`estilos` y
      # `rastreo`— y `pnpm verify` acaba en `test:integracion`, que es vitest. Así
      # que las cinco que comprueban un TOTAL COBRADO contra el servidor llevaban
      # sin correr desde la vuelta 2.3, y en la 2.35 guardaban DOS defectos, los dos
      # metidos por esa misma etapa y uno de ellos de DINERO: la pantalla de cobro
      # de la tienda enseñaba `$42.00` para un producto de `$42.90`, porque `Dinero`
      # partía el importe en tres hijos de un `inline-flex`.
      #
      # Una puerta que no corre no es una puerta. Van DESPUÉS del rastreo porque el
      # rastreo termina soltando la caja, que es el estado que estas suites saben
      # abrir; y si el rastreo falla, éstas no llegan a correr, que también informa.
      #
      # `estetica` estuvo fuera: agendaba «hoy», y hoy no tiene huecos un lunes —el
      # salón de la demostración descansa— ni de noche. Desde el cierre de la 2.35 la
      # prueba agenda el PRÓXIMO MIÉRCOLES en la zona del negocio y lleva la agenda a
      # ese día con su botón «Día siguiente»: ya no depende de la hora, y entra.
      #
      # Y LA DEMOSTRACIÓN SE VUELVE A SEMBRAR ANTES, porque el rastreo la deja usada.
      #
      # La primera vez que estas suites entraron aquí, la de la cafetería falló con
      # «/cafeteria/cobrar abrió en 200 y NO enseñó lo suyo» — y en local había pasado
      # en 56 s. La diferencia es el estado: el rastreador acaba de tocar CADA BOTÓN de
      # cada pantalla, turnos incluidos, así que la demostración que la suite encuentra
      # no es la que la suite espera. No es un defecto de ninguna de las dos.
      #
      # Es el mismo comando que ya corre más arriba —`configuracion.resetear_demo`, con
      # su transacción y su auditoría— y cuesta segundos. La alternativa era poner la
      # suite ANTES del rastreo, y entonces el rastreador heredaría una venta cobrada y
      # una caja abierta: se arregla el barato y se protege el gate que más cuesta.
      - name: El restaurante de prueba, otra vez
        if: matrix.estilo == 'reducido' || matrix.estilo == 'don-poncho'
        run: node --conditions=react-server scripts/sembrar-pruebas.mjs --solo prueba-restaurante

      - name: La suite de su modelo
        if: matrix.estilo == 'reducido' || matrix.estilo == 'don-poncho'
        env:
          MORPHIQPOS_ORG_DEMO: prueba-restaurante
          MORPHIQPOS_DEMO_PERSONA: Dueña de prueba
          MORPHIQPOS_DEMO_PIN: '1234'
        run: pnpm test:e2e pruebas/e2e/${{ matrix.suite }}.spec.ts --project=escritorio

      # LA GALERÍA, contra la vuelta anterior. Cada retrato se compara con el que está
      # en el repositorio (`pruebas/e2e/galeria.spec.ts-snapshots`): un cambio de
      # diseño que nadie declaró la pone en rojo y deja la imagen de la diferencia en
      # el artefacto. Declarar es regenerar —este flujo a mano con
      # `actualizar_galeria`— y subir las imágenes nuevas con el cambio que las motiva.
      - name: El restaurante de prueba, para la galería
        if: matrix.estilo == 'reducido' || matrix.estilo == 'don-poncho'
        run: node --conditions=react-server scripts/sembrar-pruebas.mjs --solo prueba-restaurante

      - name: La galería, contra la vuelta anterior
        if: matrix.estilo == 'reducido' || matrix.estilo == 'don-poncho'
        env:
          MORPHIQPOS_ORG_DEMO: prueba-restaurante
          MORPHIQPOS_DEMO_PERSONA: Dueña de prueba
          MORPHIQPOS_DEMO_PIN: '1234'
        run: pnpm test:e2e pruebas/e2e/galeria.spec.ts --project=escritorio ${{ inputs.actualizar_galeria && '--update-snapshots=all' || '' }}

      - name: Los retratos de la galería
        if: always() && (matrix.estilo == 'reducido' || matrix.estilo == 'don-poncho')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: galeria-${{ matrix.modelo }}
          path: pruebas/e2e/galeria.spec.ts-snapshots
          retention-days: 14
          if-no-files-found: ignore

      # La bitácora en vivo del rastreo y las trazas de lo que falló. Sin esto, un
      # fallo en CI dice «hay botones muertos» y no cuáles.
      - name: La bitácora del rastreo
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rastreo-${{ matrix.modelo }}-${{ matrix.estilo }}
          path: |
            pruebas/e2e/.resultados
            playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # LA JORNADA COMPLETA DE CADA MODELO, conciliada al centavo contra el servidor (cierre de
  # la 2.4).
  #
  # Cada modelo vive su día por las pantallas de cada rol —apertura con fondo, cobros por
  # método, mixtos y cambio, descuentos con el PIN del supervisor, cancelaciones,
  # devoluciones totales y parciales, compras, conteos y mermas, gastos y retiros, cortes
  # de turno y el cierre a ciegas con su PDF, y lo propio de cada uno: la remisión a crédito
  # de la ferretería, las dos cajas de la cafetería, la mesa y la cocina del restaurante,
  # la cita y la cabina del salón— y al final el libro de la prueba se concilia con lo que
  # el servidor guardó: ventas, pagos, cajón, devoluciones, saldos, pasivos e inventario. Y
  # con UN centavo de más, NO cuadra: la conciliación no da verde por defecto.
  #
  # Hasta este cierre las cinco existían y no corrían en ninguna parte. Un generador al
  # día no sustituye ejecutar las pruebas.
  #
  # ── Los aparatos ─────────────────────────────────────────────────────────
  # Los de quien opera cada modelo (`04-INTERFAZ` de cada uno): el mostrador de la tienda,
  # la cafetería y la ferretería en la PC y en la tableta; el restaurante y el salón en la
  # tableta. El TELÉFONO va DENTRO de cada día, donde el negocio lo usa: el dueño lee el
  # corte en el suyo (un Pixel 7 aparte que entra con su PIN), y la estilista ve su día.
  # Correr el día entero en un teléfono probaría algo que el producto declara que no hace:
  # «el dueño no cobra desde el teléfono» (abarrotes, `00-FICHA-Y-EJES`).
  # El RESTAURANTE corre en los tres: su `04-INTERFAZ` declara el teléfono para la cocina
  # chica, para el dueño que cobra una mesa y para el cierre, la mesera tiene en él su
  # carrito flotante (donde viven «Enviar a Cocina» y «Solicitar cuenta»), y es el recorrido
  # que Miguel presenta desde su teléfono y su PC (D-42).
  #
  # Los tres aparatos se emulan sobre Chromium (`playwright.config.ts`). WebKit y Firefox
  # no corren aquí, y está dicho: el iPad real entra con su pantalla de mesero; hasta
  # entonces la diferencia que se prueba es de ancho, tacto y agente, no de motor.
  #
  # ── Sin reintentos ───────────────────────────────────────────────────────
  # `--retries=0`: un día que sólo cuadra al segundo intento no cuadró —el primero dejó
  # ventas, cajas y existencias—, y un reintento escondería justo la clase de fallo que esta
  # puerta existe para ver. `--workers=1`: los dos aparatos viven el MISMO negocio, uno
  # después del otro, cada uno desde su propio reseteo.
  jornada:
    name: Jornada completa · ${{ matrix.modelo }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - modelo: restaurante
            suite: dia-completo-restaurante
            aparatos: --project=escritorio --project=tablet --project=telefono

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: morphiqpos
          POSTGRES_PASSWORD: morphiqpos_ci
          POSTGRES_DB: morphiqpos_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U morphiqpos -d morphiqpos_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://morphiqpos:morphiqpos_ci@localhost:5433/morphiqpos_e2e
      APP_URL: http://localhost:3200
      ORGANIZACION: prueba-restaurante
      # Sin almacén de archivos en CI, como en el rastreo: el contrato del entorno exige las
      # cuatro y la aplicación lo traduce a un 503 legible.
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: pos-don-poncho
      STORAGE_ACCESS_KEY: e2e-sin-almacen
      STORAGE_SECRET_KEY: e2e-sin-almacen
      # De usar y tirar, de este trabajo y de nadie más: la base nace y muere con él.
      SESSION_SECRET: e2e_de_ci_firma_de_sesion_efimera_2026_x
      PIN_PEPPER: e2e_de_ci_pimienta_de_pin_efimera_2026_xx
      NODE_ENV: production
      TZ: America/Mexico_City

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: El navegador de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: El rol de la aplicación en la base
        env:
          PGPASSWORD: morphiqpos_ci
        run: |
          CONEXION="-h localhost -p 5433 -U morphiqpos -d morphiqpos_e2e"
          if [ -z "$(psql $CONEXION -tAc "select 1 from pg_roles where rolname = 'morphiqpos_app'")" ]; then
            psql $CONEXION -v ON_ERROR_STOP=1 -c "create role morphiqpos_app with login bypassrls"
          fi

      - name: Migraciones
        run: pnpm --filter @morphiqpos/data migrate

      # El negocio, su sucursal y su dueño por las MISMAS órdenes del alta de un negocio de
      # verdad; el catálogo, el equipo con sus roles y el inventario, por el mismo reseteo
      # que corre en el despliegue. La prueba vuelve a resetear al empezar cada aparato.
      - name: El restaurante de prueba
        run: |
          pnpm db:alta-negocio \
            --slug "prueba-restaurante" \
            --nombre "Restaurante de prueba" \
            --giro restaurante \
            --paquete restaurante
          pnpm db:bootstrap --org "prueba-restaurante" --persona "Dueña de prueba" --pin 1234
          node --conditions=react-server scripts/sembrar-pruebas.mjs --solo prueba-restaurante

      # Playwright construye y levanta el servidor él mismo (`webServer`), con este entorno.
      - name: El día completo, en los aparatos de quien lo opera
        run: pnpm test:e2e pruebas/e2e/${{ matrix.suite }}.spec.ts ${{ matrix.aparatos }} --workers=1 --retries=0

      # LO QUE EL DÍA FELIZ NO RECORRE, en el restaurante (cierre del 21-10): el portal del
      # comensal con dos grupos en la misma mesa —el segundo no hereda los avisos del primero—,
      # y lo que se repite, se duplica o se pierde: doble clic al enviar y al cobrar, la
      # respuesta perdida y su aviso, dos tabletas sobre una cuenta y el cajón cuadrado al final.
      # Cada una resetea la demo al empezar; van después del día, en el mismo servidor.
      - name: El portal del comensal y la concurrencia
        if: matrix.modelo == 'restaurante'
        run: pnpm test:e2e pruebas/e2e/restaurante-concurrencia.spec.ts pruebas/e2e/restaurante-portal-qr.spec.ts --project=escritorio --workers=1 --retries=0

      # EL ESTILO DEL NEGOCIO Y LOS ESTADOS DE MESA (cierre del 21-10): cada uno de los nueve
      # estilos —y una perilla— se elige, se guarda, sobrevive a recargar y lo ve otro aparato; y
      # cada estado de mesa se lee, con su palabra y su contraste medido sobre el peor píxel, en
      # los nueve estilos. La demo se vuelve a sembrar antes: los estados se ponen sobre mesas
      # libres, y la concurrencia deja mesas usadas.
      - name: El estilo del negocio y los estados de mesa
        if: matrix.modelo == 'restaurante'
        run: |
          node --conditions=react-server scripts/sembrar-pruebas.mjs --solo prueba-restaurante
          pnpm test:e2e pruebas/e2e/estilos-del-negocio.spec.ts pruebas/e2e/estados-de-mesa.spec.ts --project=escritorio --workers=1 --retries=0

      # LAS OPERACIONES DE MESA POR LAS VISTAS ADICIONALES (cierre del 21-10): dividir y cobrar
      # las partes, el descuento con el PIN de un supervisor, anular, cancelar, cambiar, unir y
      # separar mesas, con lo persistido afirmado en el servidor y el cajón cuadrado al centavo.
      # Va la última: deja cuentas divididas, y el reseteo con ellas es una de sus pruebas (D-6).
      - name: Las operaciones de mesa
        if: matrix.modelo == 'restaurante'
        run: pnpm test:e2e pruebas/e2e/restaurante-operaciones.spec.ts --project=escritorio --workers=1 --retries=0

      # LOS CAMBIOS DEL CLIENTE (DP-9): Recetas no pisa el área ni la visibilidad (DP-9.1); el
      # portal sin asignación de mesas y los globos de solicitud sobre cada mesa, en los tres
      # aparatos —el teléfono del mesero pinta las mesas como tarjetas, no como plano— (DP-9.2); la
      # vista «Solicitudes» de Mesas, con la voz sólo ahí (DP-9.3); el teléfono de una estación de
      # cocina, sin sesión, con la botonera (DP-9.4); los botones sobre la carta del menú QR y el
      # aspecto del portal (DP-9.7); cada estación de cocina ve lo suyo (DP-10.1); el QR de una
      # mesa unida lleva a la principal (DP-10.3); Morfi en el 404, el portal y la carga larga,
      # con la mascota encendida y apagada (DP-11.1). En `fase-b`: el pedido compartido de la mesa
      # (DP-9.5) y unir mesas arrastrándolas en el mapa, con su QR y separarlas (DP-9.6).
      # Cada una resetea la demo al empezar.
      - name: Los cambios del cliente
        if: matrix.modelo == 'restaurante'
        run: |
          pnpm test:e2e pruebas/e2e/recetas-area-y-visibilidad.spec.ts --project=escritorio --workers=1 --retries=0
          pnpm test:e2e pruebas/e2e/portal-sin-asignacion.spec.ts --project=escritorio --project=tablet --project=telefono --workers=1 --retries=0
          pnpm test:e2e pruebas/e2e/vista-de-solicitudes.spec.ts --project=escritorio --project=tablet --project=telefono --workers=1 --retries=0
          pnpm test:e2e pruebas/e2e/telefono-de-cocina.spec.ts --project=escritorio --project=tablet --workers=1 --retries=0
          pnpm test:e2e pruebas/e2e/botones-del-menu-qr.spec.ts --project=escritorio --project=tablet --workers=1 --retries=0
          pnpm test:e2e pruebas/e2e/pedido-compartido.spec.ts --project=escritorio --project=telefono --workers=1 --retries=0
          pnpm test:e2e pruebas/e2e/unir-mesas-en-el-mapa.spec.ts --project=escritorio --project=tablet --project=telefono --workers=1 --retries=0
          pnpm test:e2e pruebas/e2e/qr-de-mesas.spec.ts --project=escritorio --project=tablet --project=telefono --workers=1 --retries=0
          pnpm test:e2e pruebas/e2e/estaciones-de-cocina.spec.ts --project=escritorio --project=tablet --project=telefono --workers=1 --retries=0
          pnpm test:e2e pruebas/e2e/qr-de-mesa-unida.spec.ts --project=escritorio --project=tablet --project=telefono --workers=1 --retries=0
          pnpm test:e2e pruebas/e2e/morfi.spec.ts --project=escritorio --project=tablet --project=telefono --workers=1 --retries=0
          pnpm test:e2e pruebas/e2e/modo-espera.spec.ts --project=escritorio --project=tablet --project=telefono --workers=1 --retries=0
          pnpm test:e2e pruebas/e2e/modo-espera-pin.spec.ts --project=escritorio --project=tablet --project=telefono --workers=1 --retries=0
          pnpm test:e2e pruebas/e2e/sonidos.spec.ts --project=escritorio --project=tablet --project=telefono --workers=1 --retries=0

      - name: Las trazas del día
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jornada-${{ matrix.modelo }}
          path: |
            pruebas/e2e/.resultados
            playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # PERMISOS POR ROL Y AISLAMIENTO ENTRE NEGOCIOS, contra el servidor (D.3 y D.4 de la 2.4).
  #
  # Con los DOS restaurantes de prueba en una sola base, como Don Poncho en la base compartida:
  #   · la MATRIZ: cada persona de cada demo toca cada ruta de comando; el rol que no está
  #     en el comando recibe 403 `SIN_PERMISO` y nada más, el que está recibe cualquier cosa
  #     menos eso. Más la cocina sin costos y el almacén sin caja.
  #   · el AISLAMIENTO: el dueño de una demo pide por su id los recursos de otra, por el
  #     puente y por cada ruta que recibe ids, y la respuesta es indistinguible de la de un
  #     id que no existe.
  # El aislamiento entre dos SUCURSALES de un mismo negocio (D-36) no está aquí porque ningún
  # alta de producto crea una segunda sucursal: lo prueban contra Postgres
  # `frontera-de-sucursal.integracion.test.ts` (el puente) y
  # `frontera-de-comandos.integracion.test.ts` (los comandos), en «Formato · lint · tipos ·
  # pruebas · build».
  permisos:
    name: Permisos por rol y aislamiento entre negocios
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: morphiqpos
          POSTGRES_PASSWORD: morphiqpos_ci
          POSTGRES_DB: morphiqpos_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U morphiqpos -d morphiqpos_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://morphiqpos:morphiqpos_ci@localhost:5433/morphiqpos_e2e
      APP_URL: http://localhost:3200
      ORGANIZACION: prueba-restaurante,prueba-restaurante-dos
      # Sin almacén de archivos en CI, como en el rastreo: el contrato del entorno exige las
      # cuatro y la aplicación lo traduce a un 503 legible.
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: pos-don-poncho
      STORAGE_ACCESS_KEY: e2e-sin-almacen
      STORAGE_SECRET_KEY: e2e-sin-almacen
      # De usar y tirar, de este trabajo y de nadie más: la base nace y muere con él.
      SESSION_SECRET: e2e_de_ci_firma_de_sesion_efimera_2026_x
      PIN_PEPPER: e2e_de_ci_pimienta_de_pin_efimera_2026_xx
      NODE_ENV: production
      TZ: America/Mexico_City
      MORPHIQPOS_DEMOS_MATRIZ: prueba-restaurante
      MORPHIQPOS_DEMOS_AISLAMIENTO: prueba-restaurante,prueba-restaurante-dos

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: El navegador de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: El rol de la aplicación en la base
        env:
          PGPASSWORD: morphiqpos_ci
        run: |
          CONEXION="-h localhost -p 5433 -U morphiqpos -d morphiqpos_e2e"
          if [ -z "$(psql $CONEXION -tAc "select 1 from pg_roles where rolname = 'morphiqpos_app'")" ]; then
            psql $CONEXION -v ON_ERROR_STOP=1 -c "create role morphiqpos_app with login bypassrls"
          fi

      - name: Migraciones
        run: pnpm --filter @morphiqpos/data migrate

      - name: Los dos restaurantes de prueba
        run: |
          pnpm db:alta-negocio --slug prueba-restaurante --nombre "Restaurante de prueba" --giro restaurante --paquete restaurante
          pnpm db:bootstrap --org prueba-restaurante --persona "Dueña de prueba" --pin 1234
          pnpm db:alta-negocio --slug prueba-restaurante-dos --nombre "Segundo restaurante de prueba" --giro restaurante --paquete restaurante
          pnpm db:bootstrap --org prueba-restaurante-dos --persona "Dueña de prueba" --pin 1234
          node --conditions=react-server scripts/sembrar-pruebas.mjs

      - name: Cada rol contra cada ruta de comando
        run: pnpm test:e2e pruebas/e2e/matriz-de-permisos.spec.ts --project=escritorio --retries=0

      - name: Ningún negocio ve lo de otro
        run: pnpm test:e2e pruebas/e2e/aislamiento.spec.ts --project=escritorio --retries=0

      - name: Las trazas
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: permisos-y-aislamiento
          path: |
            pruebas/e2e/.resultados
            playwright-report
          retention-days: 7
          if-no-files-found: ignore

  dependencias:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Vulnerabilidades altas y críticas
        # P1-07: el POS de restaurante acumuló 29 vulnerabilidades, 8 altas en
        # producción. Aquí se bloquea el merge en cuanto aparece una.
        run: pnpm audit --audit-level high --prod

  independencia:
    name: ZERO-01 · independencia de la plataforma
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bloquear los dominios heredados
        # 06-DEFECTOS §1, prueba ZERO-01: el sistema arranca y funciona con el
        # DNS hacia los dominios de la plataforma bloqueado. Se ejecuta en cada
        # corrida, no una sola vez al final.
        # La marca se compone en vez de escribirse literal: si apareciera tal
        # cual, este archivo seria un residuo para verify:residuos. La regla vale
        # tambien para quien la aplica.
        run: |
          MARCA="base""44"
          echo "127.0.0.1 app.${MARCA}.com"   | sudo tee -a /etc/hosts
          echo "127.0.0.1 media.${MARCA}.com" | sudo tee -a /etc/hosts

      - name: Preparar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar, construir y arrancar sin los dominios heredados
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm verify:cabeceras
